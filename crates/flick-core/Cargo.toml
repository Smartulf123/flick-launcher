[package]
name = "flick-core"
description = "Search modes, query parsing, file index and launcher state for Flick"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = "2"
url = "2"
walkdir = "2"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
