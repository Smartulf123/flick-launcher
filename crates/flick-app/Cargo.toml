[package]
name = "flick-app"
description = "Flick: a keyboard launcher for Windows 11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flick"
path = "src/main.rs"

[dependencies]
flick-core = { path = "../flick-core" }
anyhow = "1"
serde_json = "1"
url = "2"
# x11 and not wayland: on Linux the bar always runs on X11 (XWayland under
# Wayland), where it can be placed, kept on top and kept out of the taskbar.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"] }
open = "5"
global-hotkey = "0.9"
log = "0.4"
simplelog = "0.12"
# ksni: the Linux tray talks D-Bus in pure Rust, so no GTK or AppIndicator.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The file picker uses the desktop portal; its Wayland window-parenting
# would need libwayland, and the bar runs on X11 anyway.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
dirs = "6"

# The same winit eframe uses, for macOS-only window options.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
