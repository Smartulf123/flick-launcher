[package]
name = "flick-app"
description = "Flick: a keyboard launcher for Windows 11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "flick"
path = "src/main.rs"

[dependencies]
flick-core = { path = "../flick-core" }
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
open = "5"
global-hotkey = "0.9"
log = "0.4"
simplelog = "0.12"
tray-icon = "0.26"
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
